<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practica 2 - Realidad Aumentada</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #estado {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            z-index: 9999;
        }

        #menu {
            position: fixed;
            bottom: 15px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            z-index: 9999;
        }

        button {
            padding: 8px;
            margin: 3px;
            border: none;
            border-radius: 5px;
            background: white;
            color: black;
        }
    </style>

    <script>
        AFRAME.registerComponent('ajustar-modelo', {
            init: function () {

                this.el.addEventListener('model-loaded', () => {

                    const modelo = this.el.getObject3D('mesh');

                    if (!modelo) return;

                    const copia = modelo.clone(true);

                    copia.updateMatrixWorld(true);

                    const caja = new THREE.Box3().setFromObject(copia);

                    const tamano = new THREE.Vector3();
                    const centro = new THREE.Vector3();

                    caja.getSize(tamano);
                    caja.getCenter(centro);

                    const dimension = Math.max(
                        tamano.x,
                        tamano.y,
                        tamano.z
                    );

                    if (dimension <= 0 || !Number.isFinite(dimension)) {
                        document.getElementById('estado').textContent =
                            'El modelo tiene dimensiones incorrectas';

                        return;
                    }

                    const escala = 0.8 / dimension;

                    this.el.setAttribute('scale', {
                        x: escala,
                        y: escala,
                        z: escala
                    });

                    this.el.setAttribute('position', {
                        x: -centro.x * escala,
                        y: -caja.min.y * escala,
                        z: -centro.z * escala
                    });

                    document.getElementById('estado').textContent =
                        'Arbol cargado. Apunta al marcador Hiro';
                });

                this.el.addEventListener('model-error', () => {

                    document.getElementById('estado').textContent =
                        'Error: no se pudo cargar modelo.glb';
                });
            }
        });
    </script>
</head>

<body>

    <div id="estado">
        Cargando modelo 3D...
    </div>

    <div id="menu">

        <button onclick="cambiarTamano(1.2)">
            Aumentar
        </button>

        <button onclick="cambiarTamano(0.8)">
            Reducir
        </button>

        <button onclick="girar()">
            Girar
        </button>

        <button onclick="inclinar()">
            Inclinar
        </button>

        <button onclick="mover(0.1)">
            Subir
        </button>

        <button onclick="mover(-0.1)">
            Bajar
        </button>

        <button onclick="reiniciar()">
            Reiniciar
        </button>

    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets timeout="10000">

            <a-asset-item
                id="miModelo"
                src="./modelo.glb"
                response-type="arraybuffer">
            </a-asset-item>

        </a-assets>

        <a-marker preset="hiro">

            <a-entity id="contenedor">

                <a-entity
                    id="arbol"
                    gltf-model="#miModelo"
                    ajustar-modelo>
                </a-entity>

            </a-entity>

            <a-text
                id="texto"
                value="&#161;Mi primera AR!"
                align="left"
                color="#FFFFFF"
                position="0.55 0.15 0"
                rotation="-90 0 0"
                width="1.8"
                side="double">
            </a-text>

        </a-marker>

        <a-marker preset="kanji">

            <a-cylinder
                position="0 0.35 0"
                radius="0.25"
                height="0.7"
                color="#2196F3"
                animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 4000; loop: true; easing: linear">

                <a-box
                    position="0.23 0 0"
                    width="0.1"
                    height="0.15"
                    depth="0.1"
                    color="#FFFFFF">
                </a-box>

            </a-cylinder>

            <a-text
                value="Marcador Kanji"
                align="left"
                color="#FFFFFF"
                position="0.4 0.15 0"
                rotation="-90 0 0"
                width="1.8"
                side="double">
            </a-text>

        </a-marker>

        <a-entity
            light="type: ambient; intensity: 1">
        </a-entity>

        <a-entity
            light="type: directional; intensity: 0.8"
            position="1 3 2">
        </a-entity>

        <a-entity camera></a-entity>

    </a-scene>

    <script>

        const contenedor =
            document.getElementById("contenedor");

        const texto =
            document.getElementById("texto");

        let escala = 1;
        let altura = 0;
        let rotacion = 0;
        let inclinacion = 0;

        function cambiarTamano(factor) {

            escala *= factor;

            escala = Math.max(
                0.3,
                Math.min(escala, 2)
            );

            contenedor.setAttribute("scale", {
                x: escala,
                y: escala,
                z: escala
            });

            actualizarTexto();
        }

        function girar() {

            rotacion = (rotacion + 45) % 360;

            contenedor.setAttribute("rotation", {
                x: inclinacion,
                y: rotacion,
                z: 0
            });
        }

        function inclinar() {

            inclinacion = inclinacion === 0 ? -90 : 0;

            contenedor.setAttribute("rotation", {
                x: inclinacion,
                y: rotacion,
                z: 0
            });
        }

        function mover(cantidad) {

            altura += cantidad;

            contenedor.setAttribute("position", {
                x: 0,
                y: altura,
                z: 0
            });
        }

        function actualizarTexto() {

            texto.setAttribute("position", {
                x: 0.4 * escala + 0.15,
                y: 0.15,
                z: 0
            });
        }

        function reiniciar() {

            escala = 1;
            altura = 0;
            rotacion = 0;
            inclinacion = 0;

            contenedor.setAttribute("scale", "1 1 1");

            contenedor.setAttribute("position", "0 0 0");

            contenedor.setAttribute("rotation", "0 0 0");

            texto.setAttribute("position", "0.55 0.15 0");
        }

    </script>

</body>
</html>
